<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta property="og:title" content="Studio Peregrino">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.studioperegrino.com.br/">
    <meta property="og:description" content="DESIGN INTELIGENTE">
    <meta itemprop="name" content="Studio Peregrino">
    <meta itemprop="description" content="DESIGN INTELIGENTE">
    <meta itemprop="url" content="https://www.studioperegrino.com.br/">

    <title>Studio Peregrino</title>
    <link rel="icon" href="favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Expletus+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet"> 
    <script src="cdn-tailwindcss-3.4.5.js"></script>
</head>

<body class="animate-fadeIn flex-col p-4 animate-fadeIn justify-start items-center space-y-12 overflow-x-hidden">
    <header class="w-full fixed top-0 z-50 h-20">
        <div class="flex flex-col justify-center items-center">
            <div class="flex flex-col p-4 rounded-b-3xl w-full justify-center items-center">
                <div class="flex justify-between items-center w-full">
                    <div class="flex">
                        <img src="images/StudioPeregrinoCompletoInline.png" class="w-28" alt="logo">
                    </div>
                    <nav class="flex  items-center gap-2 p-2  rounded-l-md rounded-br-md">
                        <a href="#home">
                            <div class="flex uppercase px-2 py-1 rounded transition duration-100 ease-in-out">
                                <span class="font-semibold uppercase">Home</span>
                            </div>
                        </a>
                        <a href="#trabalhos">
                            <div class="flex uppercase px-2 py-1 rounded transition duration-100 ease-in-out">
                                <span class="font-semibold uppercase">Trabalhos</span>
                            </div>
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <section class="flex flex-col lg:flex-row w-full h-screen border border-white rounded-2xl items-center" id="home">
        <div class="flex flex-col w-1/2 p-4 gap-4 justify-center h-screen items-start">
            <div class="flex flex-col w-full">
                <h1 class="font-imperial xl:text-10xl 2xl:text-12xl w-fit">Design</h1>
                <div class="flex">
                    <h1 class="font-extralight text-8xl -mt-2">Inteligente</h1>
                </div>
            </div>
            <div class="flex flex-col">
                <h2 class="text-2xl font-light text-start w-fit">Criado por humanos</h2>
                <h2 class="text-2xl font-light text-start w-fit">potencializado por <span class="py-1 px-2 rounded-xl border border-yellow-400 bg-yellow-200 text-yellow-800">IA</span></h2>
            </div>
        </div>
        <div class="flex w-1/2 h-full justify-center items-center rounded-xl" id="home">
            <img src="images/hand.webp" class="h-full rounded-3xl object-cover" alt="mão levantada">
        </div>
    </section>
                

<section id="trabalhos" class="w-full flex flex-col justify-center items-center">
        <div class="flex flex-col p-16 rounded-3xl w-3/4 h-full gap-8">
            <div class="flex flex-col items-center w-full">
                <h1 class="font-outfit font-extralight xl:text-6xl 2xl:text-8xl w-fit">Serviços</h1>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div class="flex flex-1 h-96 rounded-3xl bg-green-500 shadow-sm"></div>
                <div class="flex flex-1 h-96 rounded-3xl bg-yellow-500"></div>
                <div class="flex flex-1 h-96 rounded-3xl bg-green-500 shadow-sm"></div>
            </div>


        </div>
    </section>

    <section id="trabalhos" class="w-full flex flex-col justify-center items-center">
        <div class="flex flex-col p-16 rounded-3xl w-3/4 h-full gap-8">
            <div class="flex flex-col text-center w-full">
                <h1 class="font-bold text-7xl">Alguns de nossos trabalhos</h1>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-1 h-96 rounded-3xl bg-green-500 shadow-sm"></div>
                <div class="flex flex-1 h-96 rounded-3xl bg-yellow-500"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-1 h-96 rounded-3xl bg-green-500 shadow-sm"></div>
                <div class="flex flex-1 h-96 rounded-3xl bg-yellow-500"></div>
            </div>

        </div>
    </section>
    
    <section class="w-full flex flex-col justify-center items-center">
        <div class="flex flex-col p-16 rounded-3xl w-3/4 h-full gap-8">
            <div class="flex flex-col text-center w-full">
                <h1 class="font-bold text-7xl">E aí? Interessado em trabalhar conosco?</h1>
            </div>
            <div class="flex flex-col text-center w-full">
                <h1 class="text-xl">Nos envie uma mensagem:</h1>
                <a href="mailto:studioperegrino.adm@gmail.com" class="hover:text-gold font-semibold">studioperegrino.adm@gmail.com</a>
            </div>
        </div>
    </section>

    <footer class="flex flex-col gap-4 justify-center items-center">
        <img src="images/StudioPeregrinoBlackCompleto.png" class="w-52"/>
        <div class="flex">
            <small>Designed & Developed by Studio Peregrino</small>
        </div>
    </footer>

    <div id="follower" class="absolute w-20 h-20 rounded-lg bg-black/10 backdrop-blur"></div>

    <script src="script.js"></script>
    <script src="cursorCircle.js"></script>
    <script src="tailwind.config.js"></script>

</body>

</html>
